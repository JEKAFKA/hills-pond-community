<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hills Pond logo">
  <defs>
    <clipPath id="badge"><circle cx="32" cy="32" r="30"/></clipPath>
    <linearGradient id="lg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeaf6"/>
      <stop offset="1" stop-color="#eaf6fb"/>
    </linearGradient>
    <linearGradient id="lg-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61a5c2"/>
      <stop offset="1" stop-color="#1b4965"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#badge)">
    <rect x="0" y="0" width="64" height="64" fill="url(#lg-sky)"/>
    <!-- sun -->
    <circle cx="45" cy="20" r="7" fill="#ffe3a3"/>
    <!-- distant hill -->
    <path d="M0 33 Q 17 21 33 31 T 64 29 V 42 H 0 Z" fill="#9ec6a0"/>
    <!-- near hill -->
    <path d="M0 40 Q 20 29 40 39 T 64 37 V 44 H 0 Z" fill="#5f9e6a"/>
    <!-- pond -->
    <rect x="0" y="40" width="64" height="24" fill="url(#lg-water)"/>
    <!-- sun reflection -->
    <g fill="#ffe3a3" opacity="0.5">
      <ellipse cx="45" cy="45" rx="6" ry="1.3"/>
      <ellipse cx="45" cy="49" rx="4.5" ry="1.1"/>
    </g>
    <!-- ripples -->
    <g stroke="#bfe0ee" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M9 52 q 5 -2.5 10 0 t 10 0"/>
      <path d="M30 57 q 5 -2.5 10 0 t 10 0"/>
    </g>
  </g>

  <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-width="3"/>
</svg>
