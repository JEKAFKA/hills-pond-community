<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Illustration of neighbors gathered for a community barbecue by the pond">
  <defs>
    <linearGradient id="bbq-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfeaf3"/><stop offset="100%" stop-color="#eaf6e9"/>
    </linearGradient>
  </defs>
  <!-- sky + pond behind -->
  <rect width="400" height="220" fill="url(#bbq-sky)"/>
  <rect y="40" width="400" height="34" fill="#7fb6cf" opacity="0.7"/>
  <g fill="#4f7d52"><circle cx="40" cy="40" r="22"/><circle cx="370" cy="36" r="24"/></g>
  <!-- grass -->
  <rect y="140" width="400" height="80" fill="#79b06a"/>
  <rect y="140" width="400" height="80" fill="#6aa45c" opacity="0.4"/>

  <!-- picnic table -->
  <g>
    <rect x="40" y="150" width="96" height="10" rx="2" fill="#b07a3e"/>
    <rect x="46" y="160" width="6" height="34" fill="#8a5a2b"/>
    <rect x="124" y="160" width="6" height="34" fill="#8a5a2b"/>
    <rect x="34" y="170" width="108" height="7" rx="2" fill="#9a6a3a"/>
    <!-- food on table -->
    <circle cx="64" cy="150" r="5" fill="#e0533a"/>
    <circle cx="90" cy="149" r="5" fill="#f0c850"/>
    <circle cx="114" cy="150" r="5" fill="#e0533a"/>
  </g>

  <!-- grill with smoke -->
  <g transform="translate(250 150)">
    <!-- smoke -->
    <g fill="#cfd8dc" opacity="0.75">
      <circle cx="14" cy="-30" r="7"/>
      <circle cx="20" cy="-44" r="6"/>
      <circle cx="12" cy="-58" r="5"/>
    </g>
    <ellipse cx="14" cy="2" rx="22" ry="7" fill="#3a4750"/>
    <rect x="-8" y="0" width="44" height="10" rx="3" fill="#52616b"/>
    <!-- coals/flames -->
    <path d="M4 0 q 4 -8 8 0 q 4 -7 8 0 q 4 -8 8 0 Z" fill="#f2a83a"/>
    <path d="M8 0 q 3 -5 6 0 q 3 -5 6 0 Z" fill="#e0533a"/>
    <!-- legs -->
    <line x1="-2" y1="8" x2="-8" y2="40" stroke="#3a4750" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="8" x2="36" y2="40" stroke="#3a4750" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="8" x2="14" y2="40" stroke="#3a4750" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- people -->
  <!-- cook at grill -->
  <g transform="translate(296 150)">
    <circle cx="0" cy="-30" r="8" fill="#e8b07a"/>
    <rect x="-9" y="-22" width="18" height="26" rx="6" fill="#c0392b"/>
    <line x1="-9" y1="-12" x2="-22" y2="-2" stroke="#e8b07a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- guest 1 -->
  <g transform="translate(170 152)">
    <circle cx="0" cy="-32" r="8" fill="#d9a06b"/>
    <rect x="-9" y="-24" width="18" height="28" rx="6" fill="#2a6f97"/>
    <rect x="-9" y="2" width="7" height="20" rx="3" fill="#37474f"/>
    <rect x="2" y="2" width="7" height="20" rx="3" fill="#37474f"/>
  </g>
  <!-- guest 2 -->
  <g transform="translate(196 154)">
    <circle cx="0" cy="-30" r="7" fill="#b9774a"/>
    <rect x="-8" y="-23" width="16" height="26" rx="6" fill="#e0a423"/>
    <rect x="-8" y="3" width="6" height="18" rx="3" fill="#5d4037"/>
    <rect x="2" y="3" width="6" height="18" rx="3" fill="#5d4037"/>
  </g>
  <!-- child -->
  <g transform="translate(214 160)">
    <circle cx="0" cy="-22" r="6" fill="#e8b07a"/>
    <rect x="-6" y="-16" width="12" height="18" rx="5" fill="#386641"/>
  </g>

  <!-- string lights -->
  <g stroke="#9a6a3a" stroke-width="2" fill="none">
    <path d="M0 70 Q 200 100 400 72"/>
  </g>
  <g fill="#ffd66b">
    <circle cx="70" cy="86" r="4"/><circle cx="140" cy="93" r="4"/>
    <circle cx="210" cy="95" r="4"/><circle cx="280" cy="92" r="4"/><circle cx="350" cy="84" r="4"/>
  </g>
</svg>
