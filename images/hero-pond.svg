<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a calm pond ringed by wooded hills at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f2"/>
      <stop offset="55%" stop-color="#e9f6fb"/>
      <stop offset="100%" stop-color="#fdf3e0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb6cf"/>
      <stop offset="100%" stop-color="#2a6f97"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6da"/>
      <stop offset="60%" stop-color="#ffe9b0"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="330" fill="url(#sky)"/>
  <circle cx="900" cy="150" r="120" fill="url(#sun)"/>
  <circle cx="900" cy="150" r="44" fill="#fff2cf"/>

  <!-- Far hills -->
  <path d="M0 230 Q 200 160 400 210 T 800 200 T 1200 200 V 330 H 0 Z" fill="#9ec6a0" opacity="0.7"/>
  <path d="M0 260 Q 250 200 520 245 T 1000 235 T 1200 250 V 330 H 0 Z" fill="#6fa977" opacity="0.85"/>

  <!-- Tree line -->
  <g fill="#4f7d52">
    <path d="M0 300 Q 120 235 240 295 T 480 290 T 760 285 T 1000 295 T 1200 285 V 340 H 0 Z"/>
  </g>
  <g fill="#3f6a44">
    <path d="M0 330 Q 160 285 360 320 T 760 315 T 1200 320 V 350 H 0 Z"/>
  </g>

  <!-- Water -->
  <rect y="320" width="1200" height="180" fill="url(#water)"/>

  <!-- Sun reflection -->
  <g fill="#ffe9b0" opacity="0.55">
    <ellipse cx="900" cy="345" rx="60" ry="5"/>
    <ellipse cx="900" cy="360" rx="48" ry="4"/>
    <ellipse cx="900" cy="375" rx="36" ry="3.5"/>
    <ellipse cx="900" cy="392" rx="26" ry="3"/>
  </g>

  <!-- Ripples -->
  <g stroke="#bfe0ee" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M120 360 q 30 -6 60 0 t 60 0"/>
    <path d="M300 400 q 40 -7 80 0 t 80 0"/>
    <path d="M520 440 q 35 -6 70 0 t 70 0"/>
    <path d="M180 460 q 45 -8 90 0 t 90 0"/>
  </g>

  <!-- Lily pads -->
  <g fill="#3f8f53" opacity="0.9">
    <path d="M210 425 a 22 11 0 1 0 44 0 l -8 0 a 14 7 0 1 1 -28 0 Z"/>
    <ellipse cx="280" cy="448" rx="18" ry="9"/>
    <ellipse cx="150" cy="450" rx="20" ry="10"/>
  </g>

  <!-- Reeds, left -->
  <g stroke="#5b7d3a" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="430" x2="56" y2="360"/>
    <line x1="78" y1="438" x2="80" y2="356"/>
    <line x1="96" y1="432" x2="100" y2="372"/>
  </g>
  <g fill="#7a5a2e">
    <rect x="52" y="348" width="9" height="22" rx="4"/>
    <rect x="76" y="344" width="9" height="22" rx="4"/>
  </g>

  <!-- Canoe -->
  <g transform="translate(640 405)">
    <path d="M0 18 Q 70 42 140 18 Q 120 30 70 32 Q 20 30 0 18 Z" fill="#8a5a2b"/>
    <path d="M4 16 Q 70 36 136 16 Q 116 26 70 27 Q 24 26 4 16 Z" fill="#b07a3e"/>
    <line x1="118" y1="8" x2="150" y2="-18" stroke="#6b4423" stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="6" r="6" fill="#2a6f97"/>
  </g>

  <!-- Birds -->
  <g stroke="#46637a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M200 120 q 14 -12 28 0 q 14 -12 28 0"/>
    <path d="M300 95 q 11 -9 22 0 q 11 -9 22 0"/>
  </g>
</svg>
