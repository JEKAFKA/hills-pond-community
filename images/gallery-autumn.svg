<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Autumn at the pond with red and gold foliage reflected in the water">
  <defs>
    <linearGradient id="ga-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e2c0"/><stop offset="100%" stop-color="#fbf3e2"/>
    </linearGradient>
    <linearGradient id="ga-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ec3d4"/><stop offset="100%" stop-color="#3a6f8a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="150" fill="url(#ga-sky)"/>
  <path d="M0 110 Q 100 80 200 105 T 400 100 V 150 H 0 Z" fill="#caa15a"/>
  <!-- autumn trees -->
  <g>
    <rect x="66" y="92" width="6" height="26" fill="#6b4423"/><circle cx="69" cy="86" r="24" fill="#c4502a"/>
    <rect x="146" y="86" width="6" height="32" fill="#6b4423"/><circle cx="149" cy="80" r="28" fill="#d98324"/>
    <rect x="246" y="90" width="6" height="28" fill="#6b4423"/><circle cx="249" cy="84" r="26" fill="#b8431f"/>
    <rect x="320" y="94" width="6" height="24" fill="#6b4423"/><circle cx="323" cy="88" r="22" fill="#e0a423"/>
  </g>
  <!-- water + reflection -->
  <rect y="150" width="400" height="110" fill="url(#ga-water)"/>
  <g opacity="0.45">
    <circle cx="69" cy="178" r="20" fill="#c4502a"/>
    <circle cx="149" cy="184" r="24" fill="#d98324"/>
    <circle cx="249" cy="180" r="22" fill="#b8431f"/>
    <circle cx="323" cy="182" r="18" fill="#e0a423"/>
  </g>
  <g stroke="#cfe6ef" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M40 220 q 24 -5 48 0 t 48 0"/>
    <path d="M220 240 q 24 -5 48 0 t 48 0"/>
  </g>
</svg>
